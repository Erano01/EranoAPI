name: EranoAPI
version: ${project.version}
main: me.erano.com.api.CorePlugin
#api-version can be 1.13 min
api-version: 1.13
commands:
  showtps:
    description: Shows the current TPS
  piano:
    description: open piano
    usage: /piano
  dialogdemo:
    description: Open a demo dialog menu (inventory menu before 1.21.6)
    usage: /dialogdemo
  eranodemo:
    description: Try the action bar, title and hologram services
    usage: /eranodemo <actionbar|title|holo|unholo>
    permission: eranoapi.demo
permissions:
  eranoapi.demo:
    default: op
