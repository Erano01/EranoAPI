name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Spigot server jars come from BuildTools and are never published anywhere (they contain Mojang's
  # code, which may not be redistributed). They only live in ~/.m2 and in this repository's Actions
  # cache, which isn't downloadable like workflow artifacts are. The first run builds all 35
  # versions (a few hours); later runs restore them from the cache and only build what's missing.
  spigot:
    name: Spigot (Common + Core + NMS + Dist)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # BuildTools needs several GB per build on top of ~/.m2; the runner ships ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up JDKs 8, 11, 17, 21, 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The last one becomes JAVA_HOME: Maven needs 25 (26.x Spigot jars are Java 25 class files).
          java-version: |
            8
            11
            17
            21
            25

      - name: Restore ~/.m2 (Spigot jars from BuildTools)
        id: m2-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-spigot-${{ hashFiles('scripts/build-spigot-jars.sh') }}-${{ github.run_id }}
          restore-keys: |
            m2-spigot-${{ hashFiles('scripts/build-spigot-jars.sh') }}-
            m2-spigot-

      - name: Count Spigot jars before
        id: before
        run: echo "count=$(find ~/.m2/repository/org/spigotmc/spigot -name '*.jar' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      # BuildTools applies patches with git, which needs an identity.
      - name: Configure git for BuildTools
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Build missing Spigot jars (BuildTools)
        env:
          JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          JAVA11_HOME: ${{ env.JAVA_HOME_11_X64 }}
          JAVA17_HOME: ${{ env.JAVA_HOME_17_X64 }}
          JAVA21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
          BUILDTOOLS_DIR: ${{ runner.temp }}/buildtools
          CLEAN_AFTER_BUILD: '1'
        run: ./scripts/build-spigot-jars.sh

      - name: Count Spigot jars after
        id: after
        if: always()
        run: echo "count=$(find ~/.m2/repository/org/spigotmc/spigot -name '*.jar' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      # Saved even when a later version failed, so the next run doesn't rebuild what already worked.
      # Only when something new was built: every entry is a few GB and the cache limit is 10 GB.
      - name: Save ~/.m2
        if: always() && steps.after.outputs.count != steps.before.outputs.count
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.m2-restore.outputs.cache-primary-key }}

      - name: Upload BuildTools logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildtools-logs
          path: ${{ runner.temp }}/buildtools/logs
          if-no-files-found: ignore

      - name: Maven build and tests
        run: mvn -B verify

      - name: Upload EranoAPI.jar
        uses: actions/upload-artifact@v4
        with:
          name: EranoAPI-spigot
          path: Spigot/Dist/target/EranoAPI.jar

  # Forge/V* and Fabric/V* are independent Gradle builds; build them in parallel.
  discover-mods:
    name: Find Forge / Fabric projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          projects=$(for d in Forge/V* Fabric/V*; do [ -x "$d/gradlew" ] && echo "$d"; done | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  mods:
    name: ${{ matrix.project }}
    needs: discover-mods
    if: needs.discover-mods.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-mods.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs 21, 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 25 (Loom 1.18 / ForgeGradle 7); 1.21.11 projects target 21.
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # EranoAPI-Common doesn't need any Spigot jar, so this job doesn't wait for the spigot one.
      - name: Install EranoAPI-Common into ~/.m2
        run: mvn -B -pl Common -am install -DskipTests

      - name: Build ${{ matrix.project }}
        env:
          JAVA21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
          SKIP_MAVEN: '1'
        run: ./scripts/build-mods.sh "${{ matrix.project }}"

      - name: Name artifact
        id: name
        run: echo "value=$(echo '${{ matrix.project }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: EranoAPI-${{ steps.name.outputs.value }}
          path: build/mods/*.jar

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ steps.name.outputs.value }}
          path: build/mods/logs

  # Tag vX.Y.Z -> one Maven Central deployment with every Maven and Gradle artifact. USER_MANAGED: the
  # deployment is validated, then waits for "Publish" at https://central.sonatype.com/publishing.
  release:
    name: Publish to Maven Central
    needs: [ spigot, mods ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs 21, 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the project versions
        run: |
          tag=${GITHUB_REF_NAME#v}
          maven=$(sed -n 's|^\t<version>\(.*\)</version>$|\1|p' pom.xml | head -1)
          [ "$tag" = "$maven" ] || { echo "Tag $tag != pom.xml version $maven"; exit 1; }
          for f in Forge/V*/gradle.properties Fabric/V*/gradle.properties; do
            v=$(sed -n 's/^\(mod_\)\{0,1\}version=\(.*\)/\2/p' "$f")
            [ "${v%%+*}" = "$tag" ] || { echo "$f: version $v doesn't start with $tag+"; exit 1; }
          done

      - name: Publish
        env:
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: USER_MANAGED
        run: ./scripts/publish-central.sh
